[package]
name = "buriti"
version = "0.1.0"
edition = "2021"
description = "Interface web local e leve para rodar modelos de IA open source"
license = "PolyForm-Noncommercial-1.0.0"

# Dependências mantidas no mínimo de propósito.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal", "net", "io-util"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false }
async-trait = "0.1"
getrandom = "0.3"
# criptografia do histórico (AEAD ChaCha20-Poly1305, RustCrypto) e verificação de downloads
chacha20poly1305 = "0.10"
sha2 = "0.10"
# extração do motor baixado (dados, nunca executados na extração)
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
# texto de PDF anexado (D55): roda só no processo filho isolado (`--pdf-extract`), nunca no servidor
lopdf = { version = "0.47", default-features = false }
tar = "0.4"
# motor próprio: mapeia o .gguf em memória e paraleliza o produto matriz-vetor
memmap2 = "0.9"
rayon = "1"
# RAM total, para recomendar modelos
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# GPU discovery (G1, D62): wgpu only enumerates adapters here; optional via the `gpu` feature
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

# Em debug sem otimização o motor próprio fica 20x mais lento; otimizamos mesmo em dev.
[profile.dev]
opt-level = 3
# As verificações de estouro/asserções impedem a vetorização dos laços de desquantização.
overflow-checks = false
debug-assertions = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Só para embutir o ícone no .exe do Windows (roda em tempo de build; não entra no binário).
[build-dependencies]
embed-resource = "2"
